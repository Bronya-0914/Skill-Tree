<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="description" content="探索螺旋星系中的知識主題，完成一棵技能樹，點亮一顆星。">
  <title>知識星系 · Skill Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ddd' d='M32 2 38 26 62 32 38 38 32 62 26 38 2 32 26 26Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="galaxy.css">
  <script src="learning-packs/catalog.js" defer></script>
  <script src="js/topic-packs.js" defer></script>
  <script src="js/galaxy-data.js" defer></script>
  <script src="js/galaxy.js" defer></script>
</head>
<body>
  <main id="galaxy" tabindex="0" aria-label="知識星系；拖曳探索，雙擊放大，方向鍵移動畫面">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="stars"></div>
    <div class="vignette" aria-hidden="true"></div>
  </main>
  <header class="masthead">
    <div class="brand-mark" aria-hidden="true">✧</div>
    <div><span class="eyebrow">SKILL ATLAS</span><h1 data-zh="知識星系" data-en="A galaxy of knowledge">知識星系</h1></div>
  </header>
  <nav class="top-controls" aria-label="Language">
    <button type="button" data-lang="zh-Hant" aria-pressed="true">中</button>
    <span class="divider"></span>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </nav>
  <section class="intro" id="intro">
    <p class="eyebrow" data-zh="每一顆星，都是一段旅程" data-en="EVERY STAR, A JOURNEY">每一顆星，都是一段旅程</p>
    <h2 data-zh="讓知識，慢慢發光。" data-en="Let your knowledge shine.">讓知識，慢慢發光。</h2>
    <p data-zh="完成一個主題的所有節點，點亮它的星星。" data-en="Complete every skill in a subject to light its star.">完成一個主題的所有節點，點亮它的星星。</p>
    <button class="locate" id="locate" type="button"><span aria-hidden="true">⌖</span> <span data-zh="定位可學習的星星" data-en="Find a learning star">定位可學習的星星</span><span aria-hidden="true">↗</span></button>
  </section>
  <section class="topic-card" id="topic-card" hidden aria-live="polite">
    <div class="card-top"><span class="eyebrow" id="topic-state"></span><button id="dismiss-topic" type="button" aria-label="收起 / Dismiss">×</button></div>
    <h2 id="topic-title"></h2>
    <p id="topic-detail"></p>
    <div class="progress-track" id="topic-track"><span id="topic-progress"></span></div>
    <a id="enter-topic" href="tree.html"><span data-zh="進入技能樹" data-en="Enter skill tree">進入技能樹</span><span aria-hidden="true">↗</span></a>
  </section>
  <div class="zoom-controls" role="group" aria-label="縮放 / Zoom">
    <button id="zoom-in" type="button" aria-label="放大 / Zoom in">+</button>
    <button id="overview" type="button" aria-label="全域視角 / Overview">⊙</button>
    <button id="zoom-out" type="button" aria-label="縮小 / Zoom out">−</button>
  </div>
  <footer>
    <span id="galaxy-status"></span>
    <span class="gesture-hint" data-zh="拖曳探索 · 雙擊 / 雙點靠近星星" data-en="Drag to explore · Double-click / double-tap to approach">拖曳探索 · 雙擊 / 雙點靠近星星</span>
    <span id="view-scale">01.0×</span>
  </footer>
  <p id="load-warning" role="status" hidden></p>
  <noscript>請啟用 JavaScript，或直接前往 <a href="tree.html">技能樹 / Skill tree</a>。</noscript>
</body>
</html>
